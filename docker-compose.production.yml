name: marketsage

services:
  analysis-engine:
    build:
      context: ./user/analysis-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8000"
      PRICE_CACHE_TTL_SECONDS: ${PRICE_CACHE_TTL_SECONDS:-900}
      MAX_STALE_CACHE_AGE_SECONDS: ${MAX_STALE_CACHE_AGE_SECONDS:-86400}
      DATA_SNAPSHOT_DIR: /data/snapshots
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TINDEX_API_BASE_URL: ${TINDEX_API_BASE_URL:-}
      TINDEX_API_TOKEN: ${TINDEX_API_TOKEN:-}
    volumes:
      - market_data:/data
    expose:
      - "8000"
    networks:
      - marketsage-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    security_opt:
      - no-new-privileges:true

  user-backend:
    build:
      context: ./user/user-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4500"
      ANALYSIS_ENGINE_URL: http://analysis-engine:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:${USER_BACKEND_PORT:-4500}:4500"
    depends_on:
      analysis-engine:
        condition: service_healthy
    networks:
      - marketsage-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4500/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    security_opt:
      - no-new-privileges:true

  user-frontend:
    build:
      context: ./user/user-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:${USER_FRONTEND_PORT:-3000}:3000"
    depends_on:
      user-backend:
        condition: service_healthy
    networks:
      - marketsage-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35s
    security_opt:
      - no-new-privileges:true

volumes:
  market_data:

networks:
  marketsage-internal:
    driver: bridge
