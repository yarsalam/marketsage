name: MarketSage self-hosted worker acceptance

on:
  push:
    branches:
      - infra/durable-provider-dispatch-outbox-2026-11
    paths:
      - ".github/workflows/self-hosted-worker-acceptance.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketsage-self-hosted-worker-acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cancel-stale-runs:
    name: Cancel stale local acceptance runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel only older runs of this smoke workflow
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/self-hosted-worker-acceptance.yml" --jq '.id')"
          stale_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id < $CURRENT_RUN_ID) | select(.status == \"queued\" or .status == \"pending\" or .status == \"in_progress\") | .id")"
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
          done <<< "$stale_runs"

  self-hosted-worker-acceptance:
    needs: [cancel-stale-runs]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      DOCKER_HOST: unix:///run/user/110/docker.sock
      XDG_RUNTIME_DIR: /run/user/110
    steps:
      - name: Checkout owner-controlled branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify dedicated unprivileged rootless Docker runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(id -u)" == "110" ]]
          [[ "$(id -un)" == "marketsage-runner" ]]
          command -v docker
          echo "IDENTITY: uid=$(id -u) gid=$(id -g) user=$(id -un)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
          ls -ld "$XDG_RUNTIME_DIR" /run/user/110 || true
          namei -l /run/user/110/docker.sock || true
          stat -Lc 'SOCKET: uid=%u gid=%g mode=%a type=%F path=%n' /run/user/110/docker.sock 2>/dev/null || true
          getfacl -p /run/user/110/docker.sock 2>/dev/null || true
          systemctl --user show docker.service -p LoadState -p ActiveState -p SubState -p FragmentPath || true
          systemctl --user status docker --no-pager 2>&1 | tail -30 || true
          docker info --format '{{json .SecurityOptions}}' | tee /tmp/marketsage-docker-security.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          options = " ".join(json.loads(Path("/tmp/marketsage-docker-security.json").read_text())).lower()
          if "seccomp" not in options or ("rootless" not in options and "userns" not in options) or "unconfined" in options:
              raise SystemExit("rootless Docker with seccomp/userns is required")
          PY

      - name: Verify owner-controlled clean main source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git branch --show-current)" == "infra/durable-provider-dispatch-outbox-2026-11" ]]
          git status --porcelain
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install infrastructure dependencies from Chabokan only
        run: |
          python -m pip --isolated install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: \
            --index-url https://mirror2.chabokan.net/pypi/simple/ \
            -r requirements-infra.txt

      - name: Build immutable worker image
        run: |
          set -Eeuo pipefail
          docker build --pull --no-cache \
            --file infra/worker-image/Dockerfile \
            --tag marketsage-worker:self-hosted-acceptance .
          IMAGE_ID="$(docker image inspect marketsage-worker:self-hosted-acceptance --format '{{.Id}}')"
          [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "MARKETSAGE_WORKER_IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Execute the same sandbox worker on the independent local host
        run: |
          python -m infra.control_plane.worker_acceptance \
            --image-id "$MARKETSAGE_WORKER_IMAGE_ID" \
            --commit-sha "$(git rev-parse HEAD)" \
            --workspace .
  notify-failure:
    name: Report self-hosted worker failure
    needs: [self-hosted-worker-acceptance]
    if: ${{ always() && needs.self-hosted-worker-acceptance.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Post sanitized runner checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          body="$(printf '%s\n' \
            '## Self-hosted worker acceptance failed' \
            '' \
            "- Commit: $HEAD_SHA" \
            "- Run: $RUN_URL (attempt $RUN_ATTEMPT)" \
            '' \
            'The local runner did not complete the sandbox acceptance. Inspect the linked run for the rootless Docker diagnostics. No automatic deployment or product/data work was started.')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/49/comments" -f body="$body"
