name: MarketSage Source Candidate Probes

on:
  push:
    branches:
      - feat/multimarket-batch-data-pipeline
    paths:
      - scripts/probe_sources.py

permissions:
  contents: read

concurrency:
  group: marketsage-source-probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe registered public candidates
        run: python scripts/probe_sources.py --timeout 12 --delay 1 --output source-probe-report.json
      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: marketsage-source-probe-${{ github.sha }}
          path: source-probe-report.json
          if-no-files-found: error
          retention-days: 30
