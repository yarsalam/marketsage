name: MarketSage CI

on:
  push:
    branches: [main, "deploy/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: user/analysis-engine/requirements-dev.txt
      - name: Install analysis dependencies
        working-directory: user/analysis-engine
        run: python -m pip install -r requirements-dev.txt
      - name: Test analysis API
        working-directory: user/analysis-engine
        run: pytest -q

  user-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user/user-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test -- --runInBand

  user-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user/user-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ""
        run: pnpm build
