name: MarketSage CI

on:
  push:
    branches: [main, "deploy/**", "research/**", "ci/**", "infra/**", "integration/**"]
  pull_request:
    branches: [main, "deploy/**", "infra/**"]
  # GitHub scheduled workflows run from the default branch after this PR is merged.
  # A daily full validation provides a bounded unattended health signal.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation for the same PR/ref. A newer commit supersedes
# an older queued run; independent branches remain isolated.
concurrency:
  group: marketsage-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: user/analysis-engine/requirements-dev.txt
      - name: Install analysis dependencies
        working-directory: user/analysis-engine
        run: python -m pip install -r requirements-dev.txt
      - name: Test analysis API and research backtests
        working-directory: user/analysis-engine
        run: pytest -q

  user-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: user/user-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm exec jest --runInBand

  user-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: user/user-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ""
        run: pnpm build

  admin-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9
      - name: Install admin workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build admin web
        run: pnpm --filter web build
      - name: Build admin API starter
        run: pnpm --filter server build
      - name: Test admin API starter
        run: pnpm --filter server exec jest --runInBand

  production-images:
    needs: [analysis, user-backend, user-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.production.yml config -q
      - name: Build all production images
        run: docker compose --env-file .env.production -f docker-compose.production.yml build
      - name: Smoke-test the analysis engine container
        run: |
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' marketsage-analysis-engine:latest)"
          test -n "$IMAGE_ID"
          cleanup() {
            docker rm -f marketsage-analysis-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          if ! docker run -d --name marketsage-analysis-smoke --publish 127.0.0.1:18080:8000 "$IMAGE_ID" >/dev/null; then
            echo "analysis image launch failed"
            docker image inspect --format 'image={{.Id}}' "$IMAGE_ID" || true
            exit 1
          fi
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "analysis container did not become healthy"
            docker inspect --format 'container_status={{.State.Status}} exit_code={{.State.ExitCode}}' marketsage-analysis-smoke || true
            docker logs marketsage-analysis-smoke 2>&1 | tail -n 40 | sed -E 's/(token|password|secret|authorization)[=:][^ ]+/\1=[REDACTED]/Ig' || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          base = "http://127.0.0.1:18080"
          def get(path):
              with urlopen(base + path, timeout=10) as response:
                  if response.status != 200:
                      raise SystemExit(f"analysis runtime smoke failed: {path}")
                  return json.loads(response.read().decode("utf-8"))

          health = get("/health")
          sources = get("/sources")
          quality = get("/data-quality")
          iran = get("/iran-market/providers")
          instruments = get("/instruments")
          assert health.get("status") == "ok"
          assert sources.get("sources")
          assert "storage" in quality and "sources" in quality
          assert iran.get("markets")
          assert instruments["summary"]["instrument_count"] == 11
          assert instruments["summary"]["iran_instrument_count"] == 0
          print("analysis container runtime smoke passed: 5 read-only endpoints")
          PY

  detect-direct-main-update:
    name: Detect direct main updates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify main commit provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/detect_direct_main_update.py

  ci-infra-tests:
    name: Test CI automation helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test CI and main provenance helpers
        run: |
          python3 .github/scripts/test_post_ci_failure_notice.py -v
          python3 .github/scripts/test_detect_direct_main_update.py -v

  notify-failure:
    name: Post sanitized failure notice
    needs:
      - analysis
      - user-backend
      - user-frontend
      - admin-workspace
      - production-images
      - ci-infra-tests
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Post job-level status to infrastructure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: python3 .github/scripts/post_ci_failure_notice.py
