name: MarketSage CI

on:
  push:
    branches: [main, "infra/**", "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketsage-goal1-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-infra-tests:
    name: Goal 1 infrastructure contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test watchdog behavior and workflow safety contracts
        run: |
          python3 .github/scripts/test_goal1_watchdog.py -v
          python3 .github/scripts/test_goal1_workflow_contract.py -v
