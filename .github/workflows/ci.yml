name: MarketSage CI

on:
  push:
    branches: [main, "deploy/**", "research/**", "ci/**"]
  pull_request:
    branches: [main, "deploy/**"]
  # GitHub scheduled workflows run from the default branch after this PR is merged.
  # A daily full validation provides a bounded unattended health signal.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation for the same PR/ref. A newer commit supersedes
# an older queued run; independent branches remain isolated.
concurrency:
  group: marketsage-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: user/analysis-engine/requirements-dev.txt
      - name: Install analysis dependencies
        working-directory: user/analysis-engine
        run: python -m pip install -r requirements-dev.txt
      - name: Test analysis API and research backtests
        working-directory: user/analysis-engine
        run: pytest -q

  user-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: user/user-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm exec jest --runInBand

  user-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: user/user-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ""
        run: pnpm build

  admin-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install admin workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build admin web
        run: pnpm --filter web build
      - name: Build admin API starter
        run: pnpm --filter server build
      - name: Test admin API starter
        run: pnpm --filter server exec jest --runInBand

  production-images:
    needs: [analysis, user-backend, user-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.production.yml config -q
      - name: Build all production images
        run: docker compose --env-file .env.production -f docker-compose.production.yml build

  ci-infra-tests:
    name: Test CI automation helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test sanitized failure notice helper
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  notify-failure:
    name: Post sanitized failure notice
    needs:
      - analysis
      - user-backend
      - user-frontend
      - admin-workspace
      - production-images
      - ci-infra-tests
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Post job-level status to infrastructure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          API_URL: ${{ github.api_url }}
        run: python3 .github/scripts/post_ci_failure_notice.py
