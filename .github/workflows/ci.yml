name: MarketSage CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# CI is replaceable/read-only: a newer commit supersedes an older validation
# for the same PR/ref. Stateful work is not permitted in this workflow.
concurrency:
  group: marketsage-goal1-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  classify-change-scope:
    name: Classify change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      infra_only: ${{ steps.scope.outputs.infra_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify without printing changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/classify_ci_scope.py

  # Preserve every existing required-check context. During Goal 1, these jobs
  # are skipped for the allowlisted automation-only scope and fail immediately
  # for all other/unknown scopes without executing product or research commands.
  analysis:
    needs: [classify-change-scope]
    if: ${{ needs.classify-change-scope.result == 'success' && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block analysis and backtest execution during Goal 1
        run: |
          echo "::error::Goal 1 freeze: analysis and backtest execution are paused."
          exit 1

  user-backend:
    needs: [classify-change-scope]
    if: ${{ needs.classify-change-scope.result == 'success' && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block product backend validation during Goal 1
        run: |
          echo "::error::Goal 1 freeze: product backend validation is paused."
          exit 1

  user-frontend:
    needs: [classify-change-scope]
    if: ${{ needs.classify-change-scope.result == 'success' && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block product frontend validation during Goal 1
        run: |
          echo "::error::Goal 1 freeze: product frontend validation is paused."
          exit 1

  admin-workspace:
    needs: [classify-change-scope]
    if: ${{ needs.classify-change-scope.result == 'success' && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block product admin validation during Goal 1
        run: |
          echo "::error::Goal 1 freeze: product admin validation is paused."
          exit 1

  production-images:
    needs: [classify-change-scope]
    if: ${{ needs.classify-change-scope.result == 'success' && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block production image builds during Goal 1
        run: |
          echo "::error::Goal 1 freeze: production image builds are paused."
          exit 1

  provider-neutral-control-plane-tests:
    name: Test provider-neutral control plane
    needs: [classify-change-scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a successful infrastructure-only scope classification
        env:
          CLASSIFIER_RESULT: ${{ needs.classify-change-scope.result }}
          INFRA_ONLY: ${{ needs.classify-change-scope.outputs.infra_only }}
        run: |
          if [ "$CLASSIFIER_RESULT" != "success" ] || [ "$INFRA_ONLY" != "true" ]; then
            echo "::error::Goal 1 scope classification did not complete successfully."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test CI scope, health assessment, and workflow safety contracts
        run: |
          python3 .github/scripts/test_classify_ci_scope.py -v
          python3 .github/scripts/test_goal1_watchdog.py -v

  ci-infra-tests:
    name: Test CI automation helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test sanitized failure notice and main provenance helpers
        run: |
          python3 .github/scripts/test_post_ci_failure_notice.py -v
          python3 .github/scripts/test_detect_direct_main_update.py -v

  detect-direct-main-update:
    name: Detect direct main updates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify main commit provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/detect_direct_main_update.py

  notify-failure:
    name: Post sanitized failure notice
    needs:
      - classify-change-scope
      - analysis
      - user-backend
      - user-frontend
      - admin-workspace
      - production-images
      - provider-neutral-control-plane-tests
      - ci-infra-tests
      - detect-direct-main-update
    if: ${{ always() && needs.classify-change-scope.result != 'cancelled' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/infra/')) && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Post aggregate failure status to infrastructure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: python3 .github/scripts/post_ci_failure_notice.py
