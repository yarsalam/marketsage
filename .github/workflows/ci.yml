name: MarketSage CI

on:
  push:
    branches: [main, "deploy/**", "research/**", "ci/**", "infra/**"]
  pull_request:
    branches: [main, "deploy/**", "infra/**"]
  # The scheduled path is deliberately infrastructure-only during the Goal 1 freeze.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Newer validation supersedes older validation for the same PR/ref.
concurrency:
  group: marketsage-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-change-scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      infra_only: ${{ steps.scope.outputs.infra_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify without printing changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 .github/scripts/classify_ci_scope.py

  # Product, data, analysis, and production validation are intentionally frozen
  # until infrastructure Goal 1 is accepted. Preserve the exact required-check
  # contexts: infra-only changes skip these jobs; all other scopes fail closed
  # without running product/backtest/production commands.
  analysis:
    needs: [classify-change-scope]
    if: ${{ always() && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block non-infrastructure validation during Goal 1 freeze
        run: |
          echo "::error::Product and research analysis CI is paused until infrastructure Goal 1 is accepted."
          exit 1

  user-backend:
    needs: [classify-change-scope]
    if: ${{ always() && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block product backend validation during Goal 1 freeze
        run: |
          echo "::error::Product backend CI is paused until infrastructure Goal 1 is accepted."
          exit 1

  user-frontend:
    needs: [classify-change-scope]
    if: ${{ always() && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block product frontend validation during Goal 1 freeze
        run: |
          echo "::error::Product frontend CI is paused until infrastructure Goal 1 is accepted."
          exit 1

  admin-workspace:
    needs: [classify-change-scope]
    if: ${{ always() && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block product admin validation during Goal 1 freeze
        run: |
          echo "::error::Product admin CI is paused until infrastructure Goal 1 is accepted."
          exit 1

  production-images:
    needs: [classify-change-scope]
    if: ${{ always() && needs.classify-change-scope.outputs.infra_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block production image validation during Goal 1 freeze
        run: |
          echo "::error::Production image builds are paused until infrastructure Goal 1 is accepted."
          exit 1

  detect-direct-main-update:
    name: Detect direct main updates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify main commit provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/detect_direct_main_update.py

  infra-control-plane-tests:
    name: Test provider-neutral control plane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install infrastructure test dependency
        run: python -m pip --isolated install --disable-pip-version-check --no-cache-dir -r requirements-infra.txt
      - name: Test all control-plane modules
        run: python -m unittest discover -s infra/control_plane -p 'test_*.py' -v

  ci-infra-tests:
    name: Test CI automation helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test CI scope classifier and automation helpers
        run: |
          python3 .github/scripts/test_classify_ci_scope.py -v
          python3 .github/scripts/test_post_ci_failure_notice.py -v
          python3 .github/scripts/test_detect_direct_main_update.py -v

  notify-failure:
    name: Post sanitized failure notice
    needs:
      - classify-change-scope
      - analysis
      - user-backend
      - user-frontend
      - admin-workspace
      - production-images
      - infra-control-plane-tests
      - ci-infra-tests
      - detect-direct-main-update
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Post job-level status to infrastructure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: python3 .github/scripts/post_ci_failure_notice.py
