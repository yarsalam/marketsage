name: MarketSage local TSETMC dataset acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_offline_acceptance:
        description: "Confirm offline verification of the staged local TSETMC dataset (no network probes)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: marketsage-local-research-runner
  cancel-in-progress: false

jobs:
  offline-dataset-acceptance:
    if: github.ref == 'refs/heads/main' && github.actor == 'yarsalam' && inputs.confirm_offline_acceptance == true
    runs-on: [self-hosted, linux, x64, marketsage-local, marketsage-research]
    timeout-minutes: 30
    steps:
      - name: Checkout the exact manually selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Verify staged dataset offline
        env:
          MARKETSAGE_DATASET_ROOT: /srv/marketsage/data/tsetmc_history_20261022
          MARKETSAGE_OUTPUT_DIR: /srv/marketsage/output
          MARKETSAGE_RUN_ID: ${{ github.run_id }}
          MARKETSAGE_TRIGGER_SHA: ${{ github.sha }}
          MARKETSAGE_TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          python3 user/analysis-engine/scripts/validate_staged_tsetmc_dataset.py

# Deliberately no push, pull_request, schedule, repository_dispatch, secrets,
# network probes, dependency installation, artifact upload, or production actions.
