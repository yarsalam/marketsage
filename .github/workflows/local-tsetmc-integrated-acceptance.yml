name: MarketSage local integrated TSETMC candidate acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_integrated_acceptance:
        description: "Confirm offline candidate-only analysis of the staged TSETMC corpus; no source/scoring/backtest approval"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: marketsage-local-research-runner
  cancel-in-progress: false

jobs:
  integrated-offline-acceptance:
    if: github.ref == 'refs/heads/main' && github.actor == 'yarsalam' && inputs.confirm_integrated_acceptance == true
    runs-on: [self-hosted, linux, x64, marketsage-local, marketsage-research]
    timeout-minutes: 180
    steps:
      - name: Checkout the exact manually selected workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false
          clean: true

      - name: Checkout the reviewed integrated TSETMC implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 819f8b4028469cb0d498098fec88545a18ebacc6
          path: pipeline-source
          persist-credentials: false
          clean: true

      - name: Run memory-bounded local offline TSETMC acceptance in private batches
        env:
          MARKETSAGE_DATASET_ROOT: /srv/marketsage/data/tsetmc_history_20261022
          MARKETSAGE_OUTPUT_PARENT: /srv/marketsage/output
          MARKETSAGE_OUTPUT_ROOT: /srv/marketsage/output/tsetmc-integrated-acceptance
          MARKETSAGE_PIPELINE_ROOT: ${{ github.workspace }}/pipeline-source/user/analysis-engine
          MARKETSAGE_PIPELINE_SHA: 819f8b4028469cb0d498098fec88545a18ebacc6
        run: |
          umask 077
          actual_pipeline_sha="$(git -C pipeline-source rev-parse HEAD)"
          if [ "$actual_pipeline_sha" != "$MARKETSAGE_PIPELINE_SHA" ]; then
            echo "::error::Pinned integrated pipeline commit mismatch."
            exit 1
          fi
          python3 workflow-source/user/analysis-engine/scripts/run_staged_tsetmc_acceptance.py

# Deliberately no push, pull_request, schedule, repository_dispatch, secrets,
# provider/network probes, dependency installation, artifact upload, scoring,
# backtest, production deployment, broker access, or trading.
