name: MarketSage Infrastructure Recovery

on:
  workflow_run:
    workflows:
      - MarketSage Infrastructure CI
      - MarketSage Infrastructure Watchdog
    types:
      - completed

permissions: {}

concurrency:
  group: marketsage-infra-recovery-\${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-failed-infrastructure-run-once:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'infra/'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Request one bounded retry of failed jobs
        env:
          GH_TOKEN: \${{ github.token }}
          SOURCE_RUN_ID: \${{ github.event.workflow_run.id }}
          REPOSITORY: \${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/\${REPOSITORY}/actions/runs/\${SOURCE_RUN_ID}/rerun-failed-jobs" \
            >/dev/null
          echo "One bounded retry was requested for an eligible infrastructure run."
