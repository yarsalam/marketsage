name: MarketSage Infrastructure Recovery

on:
  workflow_run:
    workflows:
      - MarketSage Infrastructure CI
      - MarketSage Infrastructure Watchdog
    types:
      - completed

permissions: {}

concurrency:
  group: marketsage-infra-recovery
  queue: max
  cancel-in-progress: false

jobs:
  retry-failed-infrastructure-run-once:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'infra/')) &&
      (github.event.workflow_run.name == 'MarketSage Infrastructure CI' ||
       github.event.workflow_run.name == 'MarketSage Infrastructure Watchdog')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Request one bounded retry of failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$SOURCE_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          test "$REPOSITORY" = "$GITHUB_REPOSITORY"
          gh api --method POST \
            "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/rerun-failed-jobs" \
            >/dev/null
          echo "One bounded retry was requested for an eligible infrastructure run."
