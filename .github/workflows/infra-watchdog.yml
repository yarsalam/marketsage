name: MarketSage Infrastructure Watchdog

on:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: marketsage-infra-watchdog
  queue: max
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect recent infrastructure workflow health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/automation/health_check.py
      - name: Write sanitized failure summary
        if: failure()
        run: |
          {
            echo "## MarketSage scheduled health check"
            echo "- Result: degraded or API unavailable"
            echo "- The check reports aggregate counts only."
            echo "- No artifacts, raw data, or token values are emitted."
          } >> "$GITHUB_STEP_SUMMARY"
