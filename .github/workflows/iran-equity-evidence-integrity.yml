name: Iran Equity Evidence Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "data/market-research/iran-equities/adjustment-evidence/**"
      - "scripts/research/import_iran_equity_evidence.py"
      - "scripts/research/audit_tsetmc_event_identity.py"
      - "scripts/research/test_audit_tsetmc_event_identity.py"
      - "scripts/research/audit_tsetmc_daily_history.py"
      - "scripts/research/test_audit_tsetmc_daily_history.py"
      - ".github/workflows/iran-equity-evidence-integrity.yml"
  push:
    branches: ["research/**"]
    paths:
      - "data/market-research/iran-equities/adjustment-evidence/**"
      - "scripts/research/import_iran_equity_evidence.py"
      - ".github/workflows/iran-equity-evidence-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iran-equity-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile research importer
        run: python -m py_compile scripts/research/import_iran_equity_evidence.py
      - name: Verify imported evidence and SHA-256 manifest
        run: python scripts/research/import_iran_equity_evidence.py --verify-existing --repo-root .
      - name: Audit TSETMC event-feed instrument identities
        run: python scripts/research/audit_tsetmc_event_identity.py --repo-root .
      - name: Audit imported TSETMC daily history
        run: python scripts/research/audit_tsetmc_daily_history.py --repo-root .
      - name: Test TSETMC daily history audit helpers
        working-directory: scripts/research
        run: python -m unittest -v test_audit_tsetmc_daily_history.py
      - name: Test TSETMC event-feed identity audit
        working-directory: scripts/research
        run: python -m unittest -v test_audit_tsetmc_event_identity.py
