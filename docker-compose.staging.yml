# Staging-only overlay. Use together with docker-compose.production.yml.
# This file adds a TLS reverse proxy and a global Basic Auth gate; it does not
# enable investment scoring or approve any market-data source.
services:
  user-backend:
    environment:
      CORS_ORIGINS: https://${STAGING_DOMAIN:?Set STAGING_DOMAIN in .env.staging}

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?Set STAGING_DOMAIN in .env.staging}
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:?Set STAGING_BASIC_AUTH_USER in .env.staging}
      STAGING_BASIC_AUTH_HASH: ${STAGING_BASIC_AUTH_HASH:?Set STAGING_BASIC_AUTH_HASH in .env.staging}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      user-backend:
        condition: service_healthy
      user-frontend:
        condition: service_healthy
    networks:
      - marketsage-internal
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
